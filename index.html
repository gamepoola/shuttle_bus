<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shuttle Service | Radisson Resort Layan Phuket</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f9fa;
      --surface: #fff;
      --surface-soft: #f5fbfb;
      --tint: #e6f4f5;
      --text: #16343d;
      --muted: #4d6970;
      --primary: #086779;
      --primary-hover: #075463;
      --accent: #259aab;
      --line: #dce8eb;
      --control-line: #cbdfe3;
      --shadow: 0 8px 24px rgba(23, 62, 73, .055);
      --ok: #116c58;
      --danger: #a6303a;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Noto Sans Thai", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--canvas);
    }
    button, input, select { font: inherit; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 18px; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-top: 4px solid var(--accent);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .brand-logo { display: block; width: 148px; height: auto; flex: 0 0 auto; }
    .brand-copy { border-left: 1px solid var(--line); padding-left: 18px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.2; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .status { display: flex; align-items: center; gap: 9px; padding-top: 14px; padding-bottom: 0; color: var(--muted); font-size: 13px; }
    .status[data-live="true"] { color: var(--ok); font-weight: 700; }
    .status[data-live="true"] .dot { background: var(--ok); }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      min-height: 40px;
      border: 1px solid var(--control-line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--primary);
      font-size: 14px;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .chip:hover, .btn:hover { background: var(--tint); }
    .chip.active, .btn.pick, .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .chip.active:hover, .btn.pick:hover, .btn.primary:hover { background: var(--primary-hover); }
    .btn.closed { background: #edf3f4; border-color: var(--line); color: var(--muted); }
    .btn.danger { background: var(--surface); border-color: var(--control-line); color: var(--primary); }
    .btn.danger:hover { color: var(--danger); background: #fff1f2; border-color: #efc7cb; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    :is(a, button, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
    @media (min-width: 920px) {
      .grid { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); align-items: start; }
    }
    .card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 19px; box-shadow: var(--shadow); }
    .card-h { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 22px 22px 12px; }
    .card-h h2 { margin: 0; font-size: 24px; line-height: 1.35; }
    .card-h .hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .card-b { padding: 12px 22px 22px; }
    .card.inset { background: var(--surface-soft); box-shadow: none; }

    .slots { display: grid; gap: 8px; }
    .slot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
    .slot .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; min-width: 0; }
    .slot .time { min-width: 68px; font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .slot .seat { color: var(--muted); font-size: 14px; }
    .slot .seat b { color: var(--primary); font-size: 16px; }
    .slot .seat b.danger { color: var(--danger); }
    .slot .btn { min-width: 68px; min-height: 34px; padding: 5px 10px; flex: 0 0 auto; }
    .closed-label { color: var(--muted); font-size: 12px; }

    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .schedule-controls { width: 100%; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 5px; width: 100%; min-width: 0; }
    label { color: var(--muted); font-size: 14px; font-weight: 650; }
    input, select { width: 100%; min-width: 0; min-height: 44px; padding: 9px 12px; border: 1px solid var(--control-line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 16px; font-weight: 650; }
    select { cursor: pointer; }
    input[readonly] { background: var(--surface-soft); }
    input::placeholder { color: var(--muted); }

    .kpi { display: flex; flex-direction: column; gap: 5px; padding: 14px; border-radius: 14px; background: var(--tint); }
    .kpi .big { font-size: 29px; font-weight: 850; }
    .kpi .small { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .divider { height: 1px; margin: 12px 0; background: var(--line); }
    .barwrap { display: grid; gap: 7px; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    .bar .lbl { flex: 0 1 45%; min-width: 0; overflow-wrap: anywhere; color: var(--muted); font-size: 13px; font-weight: 700; }
    .bar .track { flex: 1; height: 9px; overflow: hidden; border-radius: 999px; background: var(--line); }
    .bar .fill { height: 100%; width: 0; background: var(--accent); }
    .bar .num { width: 28px; color: var(--primary); font-size: 13px; font-weight: 800; text-align: right; }
    .footer-actions { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 7px; }
    .footer-actions .btn { font-size: 12px; padding: 6px 9px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 20px; background: var(--tint); color: var(--muted); font-size: 12px; font-weight: 650; }
    .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--accent); }
    .mini, .note { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .note { padding: 8px 11px; border-radius: 10px; background: var(--tint); }
    .note:empty { display: none; }
    .danger-text { color: var(--danger); }

    .booking { max-width: 860px; }
    .booking-summary { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; padding: 13px 15px; border-radius: 14px; background: var(--tint); }
    .booking-summary strong { display: block; margin-bottom: 4px; font-size: 17px; }
    .booking-summary span { color: var(--primary); font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .booking-summary .booking-availability { font-size: 13px; }
    .booking-summary .booking-availability.danger { color: var(--danger); }
    .booking-actions { margin-top: 12px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    th, td { padding: 10px; font-size: 13px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 750; }
    tr:last-child td { border-bottom: 0; }

    .toast { display: none; position: fixed; z-index: 30; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(520px, 92vw); padding: 12px 15px; border: 1px solid var(--control-line); border-radius: 13px; background: var(--surface); box-shadow: 0 10px 28px rgba(23, 62, 73, .16); }
    .toast.show { display: block; }
    .toast .t { font-weight: 800; }
    .toast .d { margin-top: 3px; color: var(--muted); font-size: 13px; }

    @media (max-width: 600px) {
      header { position: static; }
      .wrap { padding-inline: 12px; }
      .brand { flex-wrap: wrap; gap: 11px; padding-block: 12px; }
      .brand-left { gap: 12px; }
      .brand-logo { width: 109px; }
      .brand-copy { padding-left: 12px; }
      h1 { font-size: 19px; }
      .sub { font-size: 12px; }
      .nav { width: 100%; }
      .status { padding-top: 10px; }
      main.wrap { padding-top: 10px; }
      .card-h { padding: 17px 14px 8px; }
      .card-b { padding: 10px 14px 15px; }
      .card-h h2 { font-size: 21px; }
      .booking-actions .btn { width: 100%; min-height: 44px; }
      .schedule-controls .field { max-width: 100% !important; }
    }
  </style>
</head>

  <script>
(function() {
  'use strict';

  // ============================
  // CONFIG
  // ============================
  var CAPACITY_PER_TRIP = 20;

  // Firebase config (provided by user)
  var FIREBASE_CONFIG = {"apiKey": "AIzaSyCaZSHXmDypHwR3oQm3JpFg2mOorWNU_nY", "authDomain": "laya-shuttlebus.firebaseapp.com", "projectId": "laya-shuttlebus", "storageBucket": "laya-shuttlebus.firebasestorage.app", "messagingSenderId": "15563028134", "appId": "1:15563028134:web:505a3c19fcf4a87faba667", "measurementId": "G-DC44DP40G2"};

  // LocalStorage keys (fallback)
  var LS_STATE = 'laya_bus_state_local_v1';
  var LS_LOGS  = 'laya_bus_logs_local_v1';
  var LS_UI    = 'laya_bus_ui_v1';

  // Firestore collection names (match your console screenshot)
  var COL_SLOTS = 'slots';
  var COL_LOGS  = 'logs';
  var COL_STATS = 'stats';

  // Firebase module version (CDN)
  var FB_VER = '10.12.5';

  // ============================
  // Schedule
  // ============================
  var LEGACY_DIRS = {
    out: {
      key: 'out',
      label: 'ขาไป',
      baseTimes: ['11:00','14:00','17:00'],
      timeline: [
        { key:'HOTEL', name:'Hotel', off: 0 },
        { key:'LAYAN', name:'Layan National Park', off: 5 },
        { key:'LEPHANG', name:'Le Phang Beach', off: 10 },
        { key:'BOAT', name:'Boat Avenue', off: 20 }
      ],
      selectLabel: 'จุดหมายปลายทาง',
      selectable: [
        { key:'LAYAN', name:'Layan National Park' },
        { key:'LEPHANG', name:'Le Phang Beach' },
        { key:'BOAT', name:'Boat Avenue' }
      ]
    },
    back: {
      key: 'back',
      label: 'ขากลับ',
      baseTimes: ['11:30','14:30','17:30'],
      timeline: [
        { key:'BOAT', name:'Boat Avenue', off: 0 },
        { key:'LEPHANG', name:'Le Phang Beach', off: 10 },
        { key:'LAYAN', name:'Layan National Park', off: 15 },
        { key:'HOTEL', name:'Hotel', off: 20 }
      ],
      selectLabel: 'จุดรับขึ้นรถ',
      selectable: [
        { key:'BOAT', name:'Boat Avenue' },
        { key:'LEPHANG', name:'Le Phang Beach' },
        { key:'LAYAN', name:'Layan National Park' }
      ]
    }
  };

  // Each route and direction has its own seat pool. The Boat Avenue
  // and Le Phang Beach stops share seats on the same vehicle.
  var ROUTES = {
    banana: {
      label: 'Banana Beach',
      stops: [{ key: 'BANANA', name: 'Banana Beach', returnOffset: 0 }],
      out: ['11:00', '14:00', '18:00'],
      back: ['14:30', '18:30']
    },
    layan: {
      label: 'Layan Beach',
      stops: [{ key: 'LAYAN_BEACH', name: 'Layan Beach', returnOffset: 0 }],
      out: ['11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'],
      back: ['11:10', '12:10', '13:10', '14:10', '15:10', '16:10', '17:10', '18:10']
    },
    boat: {
      label: 'Boat Avenue / Le Phang Beach',
      stops: [
        { key: 'BOAT', name: 'Boat Avenue', returnOffset: 0 },
        { key: 'LEPHANG', name: 'Le Phang Beach', returnOffset: 15 }
      ],
      out: ['12:00', '15:00', '17:00'],
      back: ['12:30', '15:30', '17:30']
    }
  };
  var STOPS = new Map();
  Object.keys(ROUTES).forEach(function(routeKey){
    ROUTES[routeKey].stops.forEach(function(stop){
      STOPS.set(stop.key, Object.assign({ routeKey: routeKey }, stop));
    });
  });
  var DEFAULT_STOP = 'BANANA';

  var DIRS = {};
  Object.keys(LEGACY_DIRS).forEach(function(dirKey){
    var roundKeys = [];
    Object.keys(ROUTES).forEach(function(routeKey){
      ROUTES[routeKey][dirKey].forEach(function(time){
        roundKeys.push(time + '_' + routeKey);
      });
    });
    DIRS[dirKey] = { baseTimes: roundKeys.sort() };
  });

  function roundTime(roundKey) { return roundKey.slice(0, 5); }
  function roundRoute(roundKey) { return ROUTES[roundKey.slice(6)]; }
  function roundLabel(roundKey) {
    var route = roundRoute(roundKey);
    return roundTime(roundKey) + (route ? ' · ' + route.label : ' · รอบเดิม');
  }

  // ============================
  // Utils
  // ============================
  function pad2(n) { return String(n).padStart(2,'0'); }
  function timeToMin(t) {
    var p = String(t).split(':'); return (parseInt(p[0],10)*60) + parseInt(p[1],10);
  }
  function minToTime(min) {
    min = ((min % (24*60)) + (24*60)) % (24*60);
    var h = Math.floor(min/60); var m = min%60;
    return pad2(h)+':'+pad2(m);
  }
  function addMin(t, delta) { return minToTime(timeToMin(t) + delta); }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function monthKeyFromDateStr(dateStr) {
    if(!dateStr) return '';
    return String(dateStr).slice(0,7);
  }
  function currentMonthKey() {
    return monthKeyFromDateStr(todayKey());
  }
  function normalizeMonthValue(v) {
    var s = String(v == null ? '' : v).trim();
    var m = s.match(/^(\d{4}-\d{2})/);
    return m ? m[1] : currentMonthKey();
  }
  function listDatesForMonth(monthStr) {
    var mk = normalizeMonthValue(monthStr);
    var parts = mk.split('-');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10) - 1;
    if(!Number.isFinite(y) || !Number.isFinite(m)) return [];
    var days = new Date(y, m + 1, 0).getDate();
    var out = [];
    for(var d = 1; d <= days; d++) out.push(parts[0] + '-' + parts[1] + '-' + pad2(d));
    return out;
  }
  function nowMin() {
    var d = new Date();
    return d.getHours()*60 + d.getMinutes();
  }
  function isClosedToday(baseTime) { return nowMin() >= timeToMin(baseTime); }

  function compareDateStr(a, b) {
    // a,b in YYYY-MM-DD
    if(a === b) return 0;
    return (a < b) ? -1 : 1;
  }

  function isSlotPast(dateStr, baseTime) {
    var today = todayKey();
    var cmp = compareDateStr(dateStr, today);
    if(cmp < 0) return true;         // past date
    if(cmp > 0) return false;        // future date
    return isClosedToday(baseTime);  // today: compare time
  }

  function slotTsMs(dateStr, timeStr) {
    // local time timestamp for the shuttle round (pickup base time)
    try {
      var parts = String(dateStr).split('-');
      var y = parseInt(parts[0],10);
      var mo = parseInt(parts[1],10)-1;
      var da = parseInt(parts[2],10);
      var tm = String(timeStr).split(':');
      var hh = parseInt(tm[0],10);
      var mm = parseInt(tm[1],10);
      return new Date(y, mo, da, hh, mm, 0, 0).getTime();
    } catch(e) {
      return Date.now();
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function toast(title, desc) {
    desc = desc || '';
    var el = document.getElementById('toast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastDesc').textContent = desc;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function parseHash() {
    var raw = location.hash || '#/';
    var parts = raw.replace(/^#/, '').split('?');
    var path = parts[0];
    var params = new URLSearchParams(parts[1] || '');
    return { path: path, params: params };
  }
  function setHash(path) { location.hash = '#'+path; }

  function downloadBlob(filename, mime, content) {
    // Robust download for Chrome/Edge/Firefox + fallback for iOS/Safari
    var blob = (content instanceof Blob) ? content : new Blob([content], { type: mime });
    if (window.navigator && window.navigator.msSaveOrOpenBlob) {
      window.navigator.msSaveOrOpenBlob(blob, filename);
      return;
    }
    var url = URL.createObjectURL(blob);

    var ua = (navigator && navigator.userAgent) ? navigator.userAgent : '';
    var isIOS = /iP(ad|hone|od)/.test(ua);
    var isSafari = /^((?!chrome|android).)*safari/i.test(ua);

    // iOS Safari download attribute is unreliable — open in a new tab
    if (isIOS || isSafari) {
      window.open(url, '_blank', 'noopener,noreferrer');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      toast('เปิดไฟล์แล้ว', 'ถ้าไม่ดาวน์โหลดอัตโนมัติ ให้กด Share/Save บนหน้าที่เปิดขึ้นมา');
      return;
    }

    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  }

  function safeKey(s) {
    // Firestore field path safety (avoid '.', '#', '$', '/', '[', ']')
    return String(s || '').replace(/[.#$\/\[\]]/g, '_');
  }

  function timeKey(t) { return 't' + String(t).replace(':',''); }

  function slotDocId(dateStr, dirKey, baseTime) {
    return dateStr + '_' + dirKey + '_' + String(baseTime).replace(':','');
  }

  function calcTimes(dirKey, baseTime, placeKey) {
    var route = roundRoute(baseTime);
    if(route) {
      var stop = route.stops.find(function(item){ return item.key === placeKey; });
      if(!stop) return null;
      var isOut = dirKey === 'out';
      var time = roundTime(baseTime);
      return {
        pickup: isOut ? 'Hotel' : stop.name,
        destination: isOut ? stop.name : 'Hotel',
        pickupTime: isOut ? time : addMin(time, stop.returnOffset),
        arriveTime: ''
      };
    }

    var dir = LEGACY_DIRS[dirKey];
    if(!dir || !placeKey) return null;

    if(dirKey === 'out') {
      var dest = dir.timeline.find(function(x){ return x.key === placeKey; });
      if(!dest) return null;
      return {
        pickup: 'Hotel',
        destination: dest.name,
        pickupTime: baseTime,
        arriveTime: addMin(baseTime, dest.off)
      };
    }

    // back
    var pickupStop = dir.timeline.find(function(x){ return x.key === placeKey; });
    var hotelStop = dir.timeline.find(function(x){ return x.key === 'HOTEL'; });
    if(!pickupStop || !hotelStop) return null;

    return {
      pickup: pickupStop.name,
      destination: 'Hotel',
      pickupTime: addMin(baseTime, pickupStop.off),
      arriveTime: addMin(baseTime, hotelStop.off)
    };
  }

  // ============================
  // Local fallback store
  // ============================
  function buildDefaultLocalSlot(dateStr, dirKey, t) {
    return { date: dateStr, dir: dirKey, time: roundTime(t), capacity: CAPACITY_PER_TRIP, available: CAPACITY_PER_TRIP, bookings: {} };
  }

  function loadLocalState() {
    try {
      var raw = localStorage.getItem(LS_STATE);
      if(!raw) return { slots: {} };
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== 'object') return { slots: {} };
      if(!parsed.slots || typeof parsed.slots !== 'object' || Array.isArray(parsed.slots)) parsed.slots = {};
      return { slots: parsed.slots };
    } catch(e) {
      return { slots: {} };
    }
  }
  function saveLocalState(st) {
    var slots = (st && st.slots && typeof st.slots === 'object') ? st.slots : {};
    localStorage.setItem(LS_STATE, JSON.stringify({ slots: slots }));
  }

  function loadLocalLogs() {
    try {
      var raw = localStorage.getItem(LS_LOGS);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e) { return []; }
  }
  function addLocalLog(entry) {
    var logs = loadLocalLogs();
    logs.unshift(entry);
    localStorage.setItem(LS_LOGS, JSON.stringify(logs));
  }

  // ============================
  // Storage abstraction (Firebase preferred, local fallback)
  // ============================
  var storage = (function(){
    var mode = 'local';
    var fb = null; // { db, auth, fs }
    var initError = null;

    function getMode() { return mode; }
    function getInitError() { return initError; }

    async function initFirebase() {
      try {
        var modApp = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app.js');
        var modAuth = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-auth.js');
        var modFs = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-firestore.js');

        var app = modApp.initializeApp(FIREBASE_CONFIG);
        var auth = modAuth.getAuth(app);

        await modAuth.signInAnonymously(auth);

        var db = modFs.getFirestore(app);

        fb = { db: db, auth: auth, fs: modFs };
        mode = 'firebase';
        initError = null;
        return true;
      } catch(e) {
        mode = 'local';
        fb = null;
        initError = e;
        console.warn('Firebase init failed, fallback to local:', e);
        toast('Firebase ใช้งานไม่ได้', 'สลับเป็นโหมด Local ชั่วคราว');
        return false;
      }
    }

    function normalizeSlotData(data) {
      data = data || {};
      // ensure bookings is a plain object
      if(!data.bookings || typeof data.bookings !== 'object' || Array.isArray(data.bookings)) data.bookings = {};
      var b = data.bookings;

      // Some legacy writes may have stored bookings as top-level fields like "bookings.A105"
      // Reconstruct them into data.bookings so the UI can show booked rooms.
      var keys = Object.keys(data);
      for(var i=0;i<keys.length;i++) {
        var k = keys[i];
        if(k.indexOf('bookings.') === 0) {
          var rk = k.slice('bookings.'.length);
          if(rk && b[rk] === undefined && data[k] !== undefined) b[rk] = data[k];
        }
      }
      return data;
    }
    async function getSlot(dateStr, dirKey, timeStr) {
      var id = slotDocId(dateStr, dirKey, timeStr);

      if(mode !== 'firebase') {
        var st = loadLocalState();
        var slot = st.slots[id] || buildDefaultLocalSlot(dateStr, dirKey, timeStr);
        return JSON.parse(JSON.stringify(slot));
      }

      var fs = fb.fs;
      var ref = fs.doc(fb.db, COL_SLOTS, id);
      var snap = await fs.getDoc(ref);
      return slotFromSnapshot(snap, dateStr, dirKey, timeStr);
    }

    function slotFromSnapshot(snap, dateStr, dirKey, timeStr) {
      return snap.exists()
        ? normalizeSlotData(snap.data())
        : buildDefaultLocalSlot(dateStr, dirKey, timeStr);
    }

    function watchSlots(dateStr, dirKey, times, onSlot, onStatus) {
      if(mode !== 'firebase') return function(){};
      var fs = fb.fs;
      var active = true;
      var states = new Map();
      onStatus('connecting');

      function updateStatus(time, state) {
        states.set(time, state);
        var values = Array.from(states.values());
        if(values.includes('error')) onStatus('error');
        else if(values.includes('cached')) onStatus('cached');
        else onStatus(values.length === times.length ? 'live' : 'connecting');
      }

      // Watch the same individual documents as getSlot, so the listener
      // uses the existing document read permissions without a collection query.
      var stops = times.map(function(time){
        var ref = fs.doc(fb.db, COL_SLOTS, slotDocId(dateStr, dirKey, time));
        return fs.onSnapshot(ref, { includeMetadataChanges: true }, function(snap){
          if(!active) return;
          var cached = snap.metadata.fromCache;
          updateStatus(time, cached ? 'cached' : 'live');
          if(!cached) onSlot(time, slotFromSnapshot(snap, dateStr, dirKey, time));
        }, function(err){
          if(!active) return;
          console.error(err);
          updateStatus(time, 'error');
        });
      });
      return function(){
        active = false;
        stops.forEach(function(stop){ stop(); });
      };
    }

    async function listSlots(dateStr, dirKey, legacy, times) {
      times = times || (legacy ? LEGACY_DIRS : DIRS)[dirKey].baseTimes;
      var slots = await Promise.all(times.map(function(time){
        return getSlot(dateStr, dirKey, time).then(function(slot){
          return Object.assign({}, slot, { time: time });
        });
      }));
      return legacy ? slots.filter(function(slot){ return Object.keys(slot.bookings).length; }) : slots;
    }

    async function book(dateStr, dirKey, timeStr, roomRaw, pax, placeKey, timesInfo) {
      if(DIRS[dirKey].baseTimes.indexOf(timeStr) < 0) return { ok:false, msg:'รอบเดิมเปิดให้ดูหรือยกเลิกเท่านั้น' };
      var room = String(roomRaw || '').trim();
      if(!room) return { ok:false, msg:'กรุณาใส่เลขห้อง' };
      var roomK = safeKey(room);

      if(mode !== 'firebase') {
        var st = loadLocalState();
        var id = slotDocId(dateStr, dirKey, timeStr);
        var slot = st.slots[id] || buildDefaultLocalSlot(dateStr, dirKey, timeStr);
        if(slot.bookings[roomK] && slot.bookings[roomK].pax > 0) return { ok:false, msg:'ห้องนี้จองแล้ว (กันการกดซ้ำ)' };
        if(pax > slot.available) return { ok:false, msg:'ที่นั่งไม่พอ' };
        slot.bookings[roomK] = {
          room: room, pax: pax, placeKey: placeKey,
          pickup: timesInfo.pickup, destination: timesInfo.destination,
          pickupTime: timesInfo.pickupTime, arriveTime: timesInfo.arriveTime,
          tsMs: Date.now()
        };
        slot.available -= pax;
        st.slots[id] = slot;
        saveLocalState(st);
        addLocalLog({
          action:'BOOK', roundKey: timeStr, pax:pax, room:room, time:roundTime(timeStr), dir:dirKey, date:dateStr,
          slotTsMs: slotTsMs(dateStr, timeStr), placeKey: placeKey,
          pickup: timesInfo.pickup, destination: timesInfo.destination,
          pickupTime: timesInfo.pickupTime, arriveTime: timesInfo.arriveTime,
          tsMs: Date.now()
        });
        return { ok:true };
      }

      try {
        var fs = fb.fs;
        var db = fb.db;
        var slotId = slotDocId(dateStr, dirKey, timeStr);
        var slotRef = fs.doc(db, COL_SLOTS, slotId);

        var monthKey = monthKeyFromDateStr(dateStr);
        var statsRef = fs.doc(db, COL_STATS, monthKey);
        var logRef = fs.doc(fs.collection(db, COL_LOGS)); // auto-id

        await fs.runTransaction(db, async function(tx){
          var snap = await tx.get(slotRef);
          var data;
          if(!snap.exists()) {
            data = buildDefaultLocalSlot(dateStr, dirKey, timeStr);
            tx.set(slotRef, Object.assign({}, data, { updatedAt: fs.serverTimestamp() }), { merge: true });
          } else {
            data = snap.data();
          }

          var capacity = (typeof data.capacity==='number') ? data.capacity : CAPACITY_PER_TRIP;
          var available = (typeof data.available==='number') ? data.available : capacity;
          var bookings = data.bookings || {};

          var existing = bookings[roomK];
          if(existing && existing.pax > 0) throw new Error('ห้องนี้จองแล้ว (กันการกดซ้ำ)');
          if(pax > available) throw new Error('ที่นั่งไม่พอ');

          var bookingObj = {
            room: room, pax: pax, placeKey: placeKey,
            pickup: timesInfo.pickup, destination: timesInfo.destination,
            pickupTime: timesInfo.pickupTime, arriveTime: timesInfo.arriveTime,
            tsMs: Date.now()
          };

          var upd = { available: (available - pax), updatedAt: fs.serverTimestamp(), bookings: {} };
          upd.bookings[roomK] = bookingObj;
          tx.set(slotRef, upd, { merge: true });
          var statUpd = { updatedAt: fs.serverTimestamp(), meta: {
            logs: fs.increment(1),
            bookEntries: fs.increment(1),
            bookPax: fs.increment(pax)
          } };
          statUpd[dirKey] = {};
          statUpd[dirKey][timeKey(timeStr)] = fs.increment(pax);
          tx.set(statsRef, statUpd, { merge: true });
tx.set(logRef, {
            action: 'BOOK', roundKey: timeStr, pax: pax, room: room, time: roundTime(timeStr), dir: dirKey,
            date: dateStr, month: monthKey,
            slotTsMs: slotTsMs(dateStr, timeStr),
            placeKey: placeKey,
            pickup: timesInfo.pickup, destination: timesInfo.destination,
            pickupTime: timesInfo.pickupTime, arriveTime: timesInfo.arriveTime,
            tsMs: Date.now(),
            ts: fs.serverTimestamp()
          });
        });

        return { ok:true };
      } catch(e) {
        console.error(e);
        return { ok:false, msg: (e && e.message) ? e.message : 'จองไม่สำเร็จ' };
      }
    }

    async function cancel(dateStr, dirKey, timeStr, roomRaw, pax) {
      var room = String(roomRaw || '').trim();
      if(!room) return { ok:false, msg:'กรุณาใส่เลขห้อง' };
      var roomK = safeKey(room);

      if(mode !== 'firebase') {
        var st = loadLocalState();
        var id = slotDocId(dateStr, dirKey, timeStr);
        var slot = st.slots[id];
        if(!slot) return { ok:false, msg:'ไม่พบรอบเวลานี้' };
        var existing = slot.bookings[roomK];
        var booked = existing ? (existing.pax || 0) : 0;
        if(booked <= 0) return { ok:false, msg:'ห้องนี้ยังไม่มีการจองในรอบนี้' };
        if(pax > booked) return { ok:false, msg:'ยกเลิกเกินจำนวนที่จองไว้' };
        var left = booked - pax;
        var existingInfo = (existing && typeof existing === 'object') ? Object.assign({}, existing) : {};
        if(left === 0) delete slot.bookings[roomK];
        else slot.bookings[roomK].pax = left;
        slot.available = Math.min(slot.capacity || CAPACITY_PER_TRIP, (slot.available || 0) + pax);
        saveLocalState(st);
        addLocalLog({
          action:'CANCEL', roundKey: timeStr, pax:pax, room:room, time:roundTime(timeStr), dir:dirKey, date:dateStr,
          slotTsMs: slotTsMs(dateStr, timeStr),
          placeKey: existingInfo.placeKey || '',
          pickup: existingInfo.pickup || '', destination: existingInfo.destination || '',
          pickupTime: existingInfo.pickupTime || '', arriveTime: existingInfo.arriveTime || '',
          tsMs: Date.now()
        });
        return { ok:true };
      }

      try {
        var fs = fb.fs;
        var db = fb.db;
        var slotId = slotDocId(dateStr, dirKey, timeStr);
        var slotRef = fs.doc(db, COL_SLOTS, slotId);
        var monthKey = monthKeyFromDateStr(dateStr);
        var statsRef = fs.doc(db, COL_STATS, monthKey);
        var logRef = fs.doc(fs.collection(db, COL_LOGS));

        await fs.runTransaction(db, async function(tx){
          var snap = await tx.get(slotRef);
          if(!snap.exists()) throw new Error('ไม่พบรอบเวลานี้');

          var data = snap.data() || {};
          var capacity = (typeof data.capacity==='number') ? data.capacity : CAPACITY_PER_TRIP;
          var available = (typeof data.available==='number') ? data.available : capacity;

          // ✅ Robust bookings map (supports legacy data)
          var bookings = {};
          if(data.bookings && typeof data.bookings === 'object' && !Array.isArray(data.bookings)) {
            bookings = Object.assign({}, data.bookings);
          }
          Object.keys(data).forEach(function(k){
            if(k.indexOf('bookings.') === 0) {
              var rk = k.slice('bookings.'.length);
              if(bookings[rk] === undefined && data[k] !== undefined) bookings[rk] = data[k];
            }
          });

          // ✅ Find booking key (case-insensitive)
          var roomNorm = String(room || '').trim();
          var roomUpper = roomNorm.toUpperCase();
          var candidates = [safeKey(roomUpper), safeKey(roomNorm), roomUpper, roomNorm];

          var foundKey = null;
          for(var i=0;i<candidates.length;i++){
            var ck = candidates[i];
            if(ck && bookings[ck] !== undefined) { foundKey = ck; break; }
          }
          if(!foundKey) {
            Object.keys(bookings).some(function(k){
              if(String(k).toUpperCase() === roomUpper) { foundKey = k; return true; }
              var obj = bookings[k];
              if(obj && typeof obj === 'object' && obj.room && String(obj.room).toUpperCase() === roomUpper) { foundKey = k; return true; }
              return false;
            });
          }
          if(!foundKey) throw new Error('ห้องนี้ยังไม่มีการจองในรอบนี้');

          var existing = bookings[foundKey];
          var booked = 0;
          if(existing && typeof existing === 'object') booked = Number(existing.pax || existing.people || 0);
          else if(typeof existing === 'number') booked = Number(existing);

          if(!Number.isFinite(booked) || booked <= 0) throw new Error('ห้องนี้ยังไม่มีการจองในรอบนี้');
          if(pax > booked) throw new Error('ยกเลิกเกินจำนวนที่จองไว้');

          var left = booked - pax;

          // Build cleaned bookings map and overwrite the whole map in Firestore (so deletions always apply)
          var newBookings = Object.assign({}, bookings);
          if(left === 0) {
            // ✅ Tombstone: prevent legacy top-level field like "bookings.A111" from reappearing on next read
            // (We keep pax=0 so UI won't show it, and booking can be re-created later.)
            if(existing && typeof existing === 'object') {
              newBookings[foundKey] = Object.assign({}, existing, { pax: 0, room: existing.room || roomNorm, _tombstone: true, tsMs: Date.now() });
            } else {
              newBookings[foundKey] = { room: roomNorm, pax: 0, _tombstone: true, tsMs: Date.now() };
            }
          } else {
            if(existing && typeof existing === 'object') {
              newBookings[foundKey] = Object.assign({}, existing, { pax: left, room: existing.room || roomNorm });
            } else {
              newBookings[foundKey] = { room: roomNorm, pax: left };
            }
          }

          // Update seats + cleaned bookings
          tx.update(slotRef, {
            available: Math.min(capacity, available + pax),
            bookings: newBookings,
            updatedAt: fs.serverTimestamp()
          });

          // Best-effort cleanup for legacy dotted-field booking (if any) so UI won't re-add it
          if(left === 0 && fs.FieldPath) {
            try {
              tx.update(slotRef, new fs.FieldPath('bookings.' + foundKey), fs.deleteField());
            } catch(_e) {}
          }

          var statUpd2 = { updatedAt: fs.serverTimestamp(), meta: { logs: fs.increment(1), cancelEntries: fs.increment(1) } };
          tx.set(statsRef, statUpd2, { merge:true });

          tx.set(logRef, {
            action: 'CANCEL', roundKey: timeStr,
            pax: pax,
            room: roomNorm,
            time: roundTime(timeStr),
            dir: dirKey,
            date: dateStr,
            month: monthKey,
            slotTsMs: slotTsMs(dateStr, timeStr),
            placeKey: (existing && existing.placeKey) ? existing.placeKey : '',
            pickup: (existing && existing.pickup) ? existing.pickup : '',
            destination: (existing && existing.destination) ? existing.destination : '',
            pickupTime: (existing && existing.pickupTime) ? existing.pickupTime : '',
            arriveTime: (existing && existing.arriveTime) ? existing.arriveTime : '',
            tsMs: Date.now(),
            ts: fs.serverTimestamp()
          });
        });

        return { ok:true };
      } catch(e) {
        console.error(e);
        return { ok:false, msg: (e && e.message) ? e.message : 'ยกเลิกไม่สำเร็จ' };
      }
    }

    function normalizeStatsDoc(data) {
      data = data || {};
      var out = (data.out && typeof data.out === 'object' && !Array.isArray(data.out)) ? data.out : {};
      var back = (data.back && typeof data.back === 'object' && !Array.isArray(data.back)) ? data.back : {};
      var meta = (data.meta && typeof data.meta === 'object' && !Array.isArray(data.meta)) ? data.meta : {};
      // Support legacy dotted field names e.g. "out.t1500" or "meta.logs"
      Object.keys(data).forEach(function(k){
        if(k.indexOf('out.') === 0) out[k.slice(4)] = data[k];
        else if(k.indexOf('back.') === 0) back[k.slice(5)] = data[k];
        else if(k.indexOf('meta.') === 0) meta[k.slice(5)] = data[k];
      });
      return { out: out, back: back, meta: meta };
    }

    async function getStatsMonth(monthKey) {
      if(mode !== 'firebase') {
        var logsAll = loadLocalLogs();
        var logsMonth = logsAll.filter(function(e){ return e && monthKeyFromDateStr(e.date) === monthKey; });

        var out = { out: {}, back: {}, meta: {
          monthLogs: logsMonth.length,
          totalLogs: logsAll.length,
          monthBookEntries: logsMonth.filter(function(e){ return e && e.action === 'BOOK'; }).length,
          monthCancelEntries: logsMonth.filter(function(e){ return e && e.action === 'CANCEL'; }).length
        } };

        Object.keys(DIRS).forEach(function(dk){
          DIRS[dk].baseTimes.concat(LEGACY_DIRS[dk].baseTimes).forEach(function(t){ out[dk][timeKey(t)] = 0; });
        });

        logsMonth.forEach(function(e){
          if(!e || e.action !== 'BOOK') return;
          if(out[e.dir] && out[e.dir][timeKey(e.roundKey || e.time)] !== undefined) out[e.dir][timeKey(e.roundKey || e.time)] += (e.pax||0);
        });

        return out;
      }

      try {
        var fs = fb.fs;
        var ref = fs.doc(fb.db, COL_STATS, monthKey);
        var snap = await fs.getDoc(ref);
        
if(!snap.exists()) return { out:{}, back:{}, meta:{} };
        var data = snap.data() || {};
        return normalizeStatsDoc(data);
} catch(e) {
        console.error(e);
        return { out:{}, back:{}, meta:{} };
      }
    }


    function rangeMsForDay(dateStr) {
      var parts = String(dateStr).split('-');
      var y = parseInt(parts[0],10); var m = parseInt(parts[1],10)-1; var d = parseInt(parts[2],10);
      var start = new Date(y,m,d,0,0,0,0).getTime();
      var end = new Date(y,m,d+1,0,0,0,0).getTime();
      return { start:start, end:end };
    }
    function rangeMsForMonth(monthStr) {
      var parts = String(monthStr).split('-');
      var y = parseInt(parts[0],10); var m = parseInt(parts[1],10)-1;
      var start = new Date(y,m,1,0,0,0,0).getTime();
      var end = new Date(y,m+1,1,0,0,0,0).getTime();
      return { start:start, end:end };
    }

    async function queryLogs(opts) {
      opts = opts || {};
      var modeQ = opts.mode || 'all';
      var limitN = opts.limit || 250;
      if(limitN < 1) limitN = 250;

      if(modeQ === 'month') opts.value = normalizeMonthValue(opts.value);

      if(mode !== 'firebase') {
        var logs = loadLocalLogs();
        if(modeQ === 'day') logs = logs.filter(function(e){ return e && e.date === opts.value; });
        if(modeQ === 'month') logs = logs.filter(function(e){ return monthKeyFromDateStr(e.date) === opts.value; });
        logs.sort(function(a,b){
          var ax = (a && typeof a.slotTsMs === 'number') ? a.slotTsMs : (a && typeof a.tsMs === 'number' ? a.tsMs : 0);
          var bx = (b && typeof b.slotTsMs === 'number') ? b.slotTsMs : (b && typeof b.tsMs === 'number' ? b.tsMs : 0);
          return bx - ax;
        });
        return logs.slice(0, limitN);
      }

      try {
        var fs = fb.fs;
        var db = fb.db;
        var col = fs.collection(db, COL_LOGS);
        var out = [];

        function pushUnique(arr, item) {
          if(!item) return;
          var key = String(item.action||'') + '|' + String(item.date||'') + '|' + String(item.dir||'') + '|' + String(item.roundKey || item.time || '') + '|' + String(item.room||'') + '|' + String(item.tsMs||'');
          if(!pushUnique._seen) pushUnique._seen = {};
          if(pushUnique._seen[key]) return;
          pushUnique._seen[key] = true;
          arr.push(item);
        }
        pushUnique._seen = {};

        async function safeCollect(qFactory, label) {
          try {
            var snaps = await fs.getDocs(qFactory());
            snaps.forEach(function(docSnap){ pushUnique(out, docSnap.data()); });
            return true;
          } catch(e) {
            console.warn('queryLogs skipped:', label, e);
            return false;
          }
        }

        if(modeQ === 'day') {
          var r = rangeMsForDay(opts.value);
          await safeCollect(function(){
            return fs.query(col,
              fs.where('slotTsMs','>=', r.start),
              fs.where('slotTsMs','<',  r.end),
              fs.orderBy('slotTsMs','desc'),
              fs.limit(limitN)
            );
          }, 'day-slotTsMs');

          if(out.length < limitN) {
            await safeCollect(function(){
              return fs.query(col, fs.where('date','==', opts.value), fs.limit(limitN - out.length));
            }, 'day-date');
          }

        } else if(modeQ === 'month') {
          var monthVal = normalizeMonthValue(opts.value);
          await safeCollect(function(){
            return fs.query(col, fs.where('month','==', monthVal), fs.limit(limitN));
          }, 'month-field');

          if(out.length < limitN) {
            var days = listDatesForMonth(monthVal);
            for(var i = days.length - 1; i >= 0 && out.length < limitN; i--) {
              await safeCollect((function(dayValue){
                return function(){
                  return fs.query(col, fs.where('date','==', dayValue), fs.limit(Math.max(1, Math.min(2000, limitN - out.length))));
                };
              })(days[i]), 'month-date-' + days[i]);
            }
          }

          if(out.length < limitN) {
            var rm = rangeMsForMonth(monthVal);
            await safeCollect(function(){
              return fs.query(col,
                fs.where('slotTsMs','>=', rm.start),
                fs.where('slotTsMs','<',  rm.end),
                fs.orderBy('slotTsMs','desc'),
                fs.limit(Math.max(1, limitN - out.length))
              );
            }, 'month-slotTsMs');
          }

        } else {
          var allOk = await safeCollect(function(){
            return fs.query(col, fs.orderBy('tsMs','desc'), fs.limit(limitN));
          }, 'all-tsMs');
          if(!allOk || out.length === 0) {
            await safeCollect(function(){
              return fs.query(col, fs.limit(limitN));
            }, 'all-limit');
          }
        }

        out.sort(function(a,b){
          var ax = (a && typeof a.slotTsMs === 'number') ? a.slotTsMs : (a && typeof a.tsMs === 'number' ? a.tsMs : 0);
          var bx = (b && typeof b.slotTsMs === 'number') ? b.slotTsMs : (b && typeof b.tsMs === 'number' ? b.tsMs : 0);
          return bx - ax;
        });

        return out.slice(0, limitN);
      } catch(e) {
        console.error(e);
        return [];
      }
    }

    async function resetDay(dateStr) {
      if(mode !== 'firebase') {
        var st = loadLocalState();
        Object.keys(DIRS).forEach(function(dirKey){
          DIRS[dirKey].baseTimes.forEach(function(t){
            var id = slotDocId(dateStr, dirKey, t);
            st.slots[id] = buildDefaultLocalSlot(dateStr, dirKey, t);
          });
        });
        saveLocalState(st);
        return true;
      }
      try {
        var fs = fb.fs;
        var db = fb.db;
        var batch = fs.writeBatch(db);
        Object.keys(DIRS).forEach(function(dirKey){
          DIRS[dirKey].baseTimes.forEach(function(t){
            var id = slotDocId(dateStr, dirKey, t);
            var ref = fs.doc(db, COL_SLOTS, id);
            batch.set(ref, Object.assign(buildDefaultLocalSlot(dateStr, dirKey, t), {
              updatedAt: fs.serverTimestamp()
            }), { merge:true });
          });
        });
        await batch.commit();
        return true;
      } catch(e) {
        console.error(e);
        return false;
      }
    }

    return {
      initFirebase: initFirebase,
      getMode: getMode,
      getInitError: getInitError,
      getSlot: getSlot,
      listSlots: listSlots,
      watchSlots: watchSlots,
      book: book,
      cancel: cancel,
      getStatsMonth: getStatsMonth,
      queryLogs: queryLogs,
      resetDay: resetDay
    };
  })();

  function xmlEscape(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function numOrZero(v) {
    var n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function normalizeRoom(room) {
    return String(room || '').trim().toUpperCase();
  }

  function buildingFromRoom(room) {
    var r = normalizeRoom(room);
    if(/^A/.test(r)) return 'A';
    if(/^B/.test(r)) return 'B';
    if(/^C/.test(r)) return 'C';
    if(/^D/.test(r)) return 'D';
    return 'Unknown';
  }

  function phaseFromBuilding(building) {
    if(building === 'A' || building === 'B' || building === 'C') return 'Phase 1';
    if(building === 'D') return 'Phase 2';
    return 'Unknown';
  }

  function signedPaxFromLog(e) {
    var pax = Math.abs(numOrZero(e && e.pax));
    if((e && e.action) === 'CANCEL') return -pax;
    return pax;
  }

  function formatPercentValue(n) {
    var val = Number(n);
    if(!Number.isFinite(val)) return '0.0%';
    return val.toFixed(1) + '%';
  }

  function sanitizeSheetName(name, fallback) {
    var s = String(name || fallback || 'Sheet').replace(/[\\\/?*\[\]:]/g, ' ').trim();
    if(!s) s = fallback || 'Sheet';
    if(s.length > 31) s = s.slice(0, 31);
    return s;
  }

  function pushAgg(map, key, defaults) {
    if(!map[key]) map[key] = Object.assign({}, defaults || {});
    return map[key];
  }

  function aggregateLogsForReport(logs) {
    logs = Array.isArray(logs) ? logs.slice() : [];

    var out = {
      totalLogs: logs.length,
      grossBookedGuests: 0,
      cancelledGuests: 0,
      netGuests: 0,
      bookEntries: 0,
      cancelEntries: 0,
      phaseMap: {},
      buildingMap: {},
      dateMap: {},
      timeMap: {},
      detailRows: []
    };

    logs.forEach(function(e){
      if(!e) return;
      var pax = Math.abs(numOrZero(e.pax));
      var signed = signedPaxFromLog(e);
      var building = buildingFromRoom(e.room || '');
      var phase = phaseFromBuilding(building);
      var date = String(e.date || '');
      var dirLabel = e.dir === 'out' ? 'ขาไป' : (e.dir === 'back' ? 'ขากลับ' : (e.dir || 'Unknown'));
      var time = e.roundKey && roundRoute(e.roundKey) ? roundLabel(e.roundKey) : String(e.time || '');
      var phaseRec = pushAgg(out.phaseMap, phase, { phase: phase, buildings: {}, gross: 0, cancel: 0, net: 0, entries: 0 });
      var buildingRec = pushAgg(out.buildingMap, building, { building: building, phase: phase, gross: 0, cancel: 0, net: 0, entries: 0 });
      var dateRec = pushAgg(out.dateMap, date || 'Unknown', {
        date: date || 'Unknown', gross: 0, cancel: 0, net: 0,
        phase1Net: 0, phase2Net: 0, unknownNet: 0
      });
      var timeKeyAgg = dirLabel + '|' + time;
      var timeRec = pushAgg(out.timeMap, timeKeyAgg, { dir: dirLabel, time: time, gross: 0, cancel: 0, net: 0, entries: 0 });

      phaseRec.entries += 1;
      buildingRec.entries += 1;
      timeRec.entries += 1;
      phaseRec.buildings[building] = true;

      if(e.action === 'CANCEL') {
        out.cancelEntries += 1;
        out.cancelledGuests += pax;
        phaseRec.cancel += pax;
        buildingRec.cancel += pax;
        dateRec.cancel += pax;
        timeRec.cancel += pax;
      } else {
        out.bookEntries += 1;
        out.grossBookedGuests += pax;
        phaseRec.gross += pax;
        buildingRec.gross += pax;
        dateRec.gross += pax;
        timeRec.gross += pax;
      }

      out.netGuests += signed;
      phaseRec.net += signed;
      buildingRec.net += signed;
      dateRec.net += signed;
      timeRec.net += signed;

      if(phase === 'Phase 1') dateRec.phase1Net += signed;
      else if(phase === 'Phase 2') dateRec.phase2Net += signed;
      else dateRec.unknownNet += signed;

      out.detailRows.push({
        timestamp: e.tsMs ? new Date(e.tsMs).toLocaleString() : '',
        date: date,
        action: e.action || '',
        direction: dirLabel,
        round: time,
        building: building,
        phase: phase,
        room: e.room || '',
        signedPax: signed,
        pax: pax,
        pickup: e.pickup || '',
        destination: e.destination || '',
        pickupTime: e.pickupTime || '',
        arriveTime: e.arriveTime || ''
      });
    });

    return out;
  }

  function buildWorkbookXml(sheets) {

          '<Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1"/>' +
          '<Interior ss:Color="#D9E2F3" ss:Pattern="Solid"/>' +

            '<Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>' +

            '<Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/>' +
            '<Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/>' +
          '</Borders>' +
        '</Style>' +
        '<Style ss:ID="sInt">' +
          '<Borders>' +
            '<Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>' +

            '<Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/>' +

          '</Borders>' +
          '<NumberFormat ss:Format="0.0%"/>' +
        '</Style>' +
      '</Styles>';

    function cellXml(cell) {
      if(cell == null) cell = { v: '' };
      if(typeof cell !== 'object' || Array.isArray(cell)) cell = { v: cell };
      var v = cell.v;
      var style = cell.style || ((cell.t === 'Number' || typeof v === 'number') ? 'sInt' : 'sText');
      var t = cell.t || ((typeof v === 'number') ? 'Number' : 'String');
      var data = (t === 'Number') ? String(Number(v || 0)) : xmlEscape(v == null ? '' : v);
      return '<Cell ss:StyleID="' + style + '"><Data ss:Type="' + t + '">' + data + '</Data></Cell>';
    }

    var worksheets = sheets.map(function(sheet){
      var rowsXml = (sheet.rows || []).map(function(row){
        return '<Row>' + row.map(cellXml).join('') + '</Row>';
      }).join('');
      return '<Worksheet ss:Name="' + xmlEscape(sanitizeSheetName(sheet.name, 'Sheet')) + '"><Table>' + rowsXml + '</Table></Worksheet>';
    }).join('');

    return '<?xml version="1.0"?>' +
      '<?mso-application progid="Excel.Sheet"?>' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
        'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
        'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
        'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" ' +
        'xmlns:html="http://www.w3.org/TR/REC-html40">' +
        styles + worksheets +
      '</Workbook>';
  }

  function buildExcomWorkbook(logs, scopeLabel) {
    var agg = aggregateLogsForReport(logs);
    var totalNet = agg.netGuests > 0 ? agg.netGuests : 0;
    var pctBase = totalNet > 0 ? totalNet : (agg.grossBookedGuests > 0 ? agg.grossBookedGuests : 0);

    function share(n) {
      if(!pctBase) return 0;
      return Math.max(0, numOrZero(n)) / pctBase;
    }

    var phaseOrder = ['Phase 1', 'Phase 2', 'Unknown'];
    var phaseRows = phaseOrder.filter(function(k){ return agg.phaseMap[k]; }).map(function(k){
      var rec = agg.phaseMap[k];
      return [
        { v: rec.phase, style: 'sText' },
        { v: Object.keys(rec.buildings || {}).filter(Boolean).join(', '), style: 'sText' },
        { v: rec.gross, t: 'Number', style: 'sInt' },
        { v: rec.cancel, t: 'Number', style: 'sInt' },
        { v: rec.net, t: 'Number', style: 'sInt' },
        { v: share(rec.net), t: 'Number', style: 'sPct' }
      ];
    });

    var buildingOrder = ['A', 'B', 'C', 'D', 'Unknown'];
    var buildingRows = buildingOrder.filter(function(k){ return agg.buildingMap[k]; }).map(function(k){
      var rec = agg.buildingMap[k];
      return [
        { v: rec.building, style: 'sText' },
        { v: rec.phase, style: 'sText' },
        { v: rec.gross, t: 'Number', style: 'sInt' },
        { v: rec.cancel, t: 'Number', style: 'sInt' },
        { v: rec.net, t: 'Number', style: 'sInt' },
        { v: share(rec.net), t: 'Number', style: 'sPct' },
        { v: rec.entries, t: 'Number', style: 'sInt' }
      ];
    });

    var dateRows = Object.keys(agg.dateMap).sort().map(function(k){
      var rec = agg.dateMap[k];
      return [
        { v: rec.date, style: 'sText' },
        { v: rec.gross, t: 'Number', style: 'sInt' },
        { v: rec.cancel, t: 'Number', style: 'sInt' },
        { v: rec.net, t: 'Number', style: 'sInt' },
        { v: rec.phase1Net, t: 'Number', style: 'sInt' },
        { v: rec.phase2Net, t: 'Number', style: 'sInt' },
        { v: rec.unknownNet, t: 'Number', style: 'sInt' }
      ];
    });

    var timeRows = Object.keys(agg.timeMap).map(function(k){ return agg.timeMap[k]; })
      .sort(function(a,b){
        var ak = String(a.dir || '') + '|' + String(a.time || '');
        var bk = String(b.dir || '') + '|' + String(b.time || '');
        return ak.localeCompare(bk);
      }).map(function(rec){
        return [
          { v: rec.dir, style: 'sText' },
          { v: rec.time, style: 'sText' },
          { v: rec.gross, t: 'Number', style: 'sInt' },
          { v: rec.cancel, t: 'Number', style: 'sInt' },
          { v: rec.net, t: 'Number', style: 'sInt' },
          { v: share(rec.net), t: 'Number', style: 'sPct' },
          { v: rec.entries, t: 'Number', style: 'sInt' }
        ];
      });

    var detailRows = agg.detailRows.map(function(r){
      return [
        { v: r.timestamp, style: 'sText' },
        { v: r.date, style: 'sText' },
        { v: r.action, style: 'sText' },
        { v: r.direction, style: 'sText' },
        { v: r.round, style: 'sText' },
        { v: r.building, style: 'sText' },

        { v: r.destination, style: 'sText' },
        { v: r.pickupTime, style: 'sText' },
        { v: r.arriveTime, style: 'sText' }
      ];
    });

    var phase1Net = agg.phaseMap['Phase 1'] ? agg.phaseMap['Phase 1'].net : 0;
    var phase2Net = agg.phaseMap['Phase 2'] ? agg.phaseMap['Phase 2'].net : 0;
    var unknownNet = agg.phaseMap['Unknown'] ? agg.phaseMap['Unknown'].net : 0;

    var summaryRows = [
      [{ v: 'LAYA Shuttle Bus – EXCOM Summary', style: 'sTitle' }],
      [{ v: 'Scope', style: 'sHead' }, { v: scopeLabel, style: 'sText' }],
      [{ v: 'Generated at', style: 'sHead' }, { v: new Date().toLocaleString(), style: 'sText' }],
      [{ v: '% basis', style: 'sHead' }, { v: 'คิดจาก Net Guests Using Service ในช่วงที่ export', style: 'sText' }],
      [],
      [{ v: 'KPI', style: 'sHead' }, { v: 'Value', style: 'sHead' }],

      [{ v: 'Phase 2 Share %', style: 'sText' }, { v: share(phase2Net), t: 'Number', style: 'sPct' }],
      [{ v: 'Unknown Share %', style: 'sText' }, { v: share(unknownNet), t: 'Number', style: 'sPct' }]
    ];

    var sheets = [
      { name: 'EXCOM Summary', rows: summaryRows },
      {
        name: 'Phase Summary',
        rows: [
          [{ v: 'Phase Summary', style: 'sTitle' }],
          [{ v: 'Phase', style: 'sHead' }, { v: 'Buildings', style: 'sHead' }, { v: 'Gross Booked Guests', style: 'sHead' }, { v: 'Cancelled Guests', style: 'sHead' }, { v: 'Net Guests', style: 'sHead' }, { v: 'Share %', style: 'sHead' }]
        ].concat(phaseRows)
      },
      {
        name: 'Building Summary',
        rows: [
          [{ v: 'Building Summary', style: 'sTitle' }],
          [{ v: 'Building', style: 'sHead' }, { v: 'Phase', style: 'sHead' }, { v: 'Gross Booked Guests', style: 'sHead' }, { v: 'Cancelled Guests', style: 'sHead' }, { v: 'Net Guests', style: 'sHead' }, { v: 'Share %', style: 'sHead' }, { v: 'Log Entries', style: 'sHead' }]
        ].concat(buildingRows)
      },
      {
        name: 'Daily Summary',
        rows: [
          [{ v: 'Daily Summary', style: 'sTitle' }],
          [{ v: 'Date', style: 'sHead' }, { v: 'Gross Booked Guests', style: 'sHead' }, { v: 'Cancelled Guests', style: 'sHead' }, { v: 'Net Guests', style: 'sHead' }, { v: 'Phase 1 Net', style: 'sHead' }, { v: 'Phase 2 Net', style: 'sHead' }, { v: 'Unknown Net', style: 'sHead' }]
        ].concat(dateRows)
      },
      {
        name: 'Round Summary',
        rows: [
          [{ v: 'Round Summary', style: 'sTitle' }],
          [{ v: 'Direction', style: 'sHead' }, { v: 'Round Time', style: 'sHead' }, { v: 'Gross Booked Guests', style: 'sHead' }, { v: 'Cancelled Guests', style: 'sHead' }, { v: 'Net Guests', style: 'sHead' }, { v: 'Share %', style: 'sHead' }, { v: 'Log Entries', style: 'sHead' }]
        ].concat(timeRows)
      },
      {
        name: 'Detail Log',
        rows: [
          [{ v: 'Detail Log', style: 'sTitle' }],
          [{ v: 'Timestamp', style: 'sHead' }, { v: 'Date', style: 'sHead' }, { v: 'Action', style: 'sHead' }, { v: 'Direction', style: 'sHead' }, { v: 'Round Time', style: 'sHead' }, { v: 'Building', style: 'sHead' }, { v: 'Phase', style: 'sHead' }, { v: 'Room', style: 'sHead' }, { v: 'Signed Pax', style: 'sHead' }, { v: 'Pax', style: 'sHead' }, { v: 'Pickup', style: 'sHead' }, { v: 'Destination', style: 'sHead' }, { v: 'Pickup Time', style: 'sHead' }, { v: 'Arrival Time', style: 'sHead' }]
        ].concat(detailRows)
      }
    ];

    return buildWorkbookXml(sheets);
  }

  async function doExport(mode, value) {
    if(mode === 'month') value = normalizeMonthValue(value);
    if(mode === 'day' && !/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))) {
      toast('Export ไม่สำเร็จ', 'รูปแบบวันไม่ถูกต้อง');
      return;
    }

    var limitN = (mode === 'day') ? 5000 : (mode === 'month' ? 20000 : 20000);
    var ua = (navigator && navigator.userAgent) ? navigator.userAgent : '';
    var isIOS = /iP(ad|hone|od)/.test(ua);
    var isSafari = /^((?!chrome|android).)*safari/i.test(ua);
    var preWin = null;
    if(isIOS || isSafari) {
      try { preWin = window.open('about:blank', '_blank', 'noopener,noreferrer'); } catch(e) { preWin = null; }
    }

    try {
      toast('กำลังเตรียมไฟล์ EXCOM', mode === 'month'
        ? ('กำลังรวมข้อมูลทั้งเดือน ' + value + ' …')
        : 'ระบบกำลังสรุป Phase 1 / Phase 2 และ Detail Log…');

      var logs;
      if(mode === 'day') logs = await storage.queryLogs({ mode:'day', value:value, limit: limitN });
      else if(mode === 'month') logs = await storage.queryLogs({ mode:'month', value:value, limit: limitN });
      else logs = await storage.queryLogs({ mode:'all', limit: limitN });

      if(!logs || logs.length === 0) {
        if(preWin && !preWin.closed) { try { preWin.close(); } catch(e) {} }
        toast('ไม่มีข้อมูล', mode === 'month'
          ? ('ไม่พบ Log ในเดือน ' + value)
          : 'ไม่พบ Log ในช่วงที่เลือก');
        return;
      }

      var scopeLabel = (mode === 'day') ? ('Daily Report ' + value) : (mode === 'month' ? ('Monthly Report ' + value) : 'All Logs');
      var xml = buildExcomWorkbook(logs, scopeLabel);
      var suffix = (mode === 'day') ? value : (mode === 'month' ? value : ('all-' + todayKey()));
      var filename = 'laya-shuttle-excom-' + suffix + '.xls';
      var mime = 'application/vnd.ms-excel;charset=utf-8';
      var blob = new Blob(['﻿' + xml], { type: mime });

      if(preWin) {
        var url = URL.createObjectURL(blob);
        try { preWin.location.href = url; } catch(e) { window.location.href = url; }
        setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
        toast('เปิดไฟล์แล้ว', 'ถ้าไม่ดาวน์โหลดอัตโนมัติ ให้กด Share/Save บนหน้าที่เปิดขึ้นมา');
        return;
      }

      downloadBlob(filename, mime, blob);

      if(logs.length >= limitN) {
        toast('Export EXCOM เสร็จแล้ว', 'หมายเหตุ: ส่งออกสูงสุด ' + limitN + ' รายการในครั้งนี้');
      } else {
        toast('Export EXCOM เสร็จแล้ว', 'จำนวน Log ที่ใช้สรุป: ' + logs.length + ' รายการ');
      }
    } catch(e) {
      console.error(e);
      if(preWin && !preWin.closed) { try { preWin.close(); } catch(err) {} }
      toast('Export ไม่สำเร็จ', (e && e.message) ? e.message : 'ลองใหม่อีกครั้ง หรือเปลี่ยนช่วงวันที่/เดือน');
    }
  }

      var sl = slotData || {};

      var entries = Object.keys(b).map(function(k){

          if(!obj.room) obj.room = k;
          if(obj.pax === undefined && obj.pax !== 0 && obj.people !== undefined) obj.pax = obj.people;
          return obj;
        }
        // กรณีบันทึกมาเป็นเลข pax อย่างเดียว
        if(typeof obj === 'number') return { room: k, pax: obj };
        return null;
      }).filter(function(x){ if(!x) return false; var p = Number(x.pax); return Number.isFinite(p) && p > 0; });

      entries.sort(function(a,c){ return String(a.room||'').localeCompare(String(c.room||'')); });

      var wrap = $('bookingsTable');

        return '<tr><td>' + escapeHtml(room) + '</td><td><b>' + escapeHtml(pax) + '</b></td><td>' + escapeHtml(line) + '</td><td>' + escapeHtml(arrive) + '</td></tr>';
      }).join('');

      wrap.innerHTML = '<table><thead><tr><th>เลขห้อง</th><th>จำนวนคน</th><th>เส้นทาง</th><th>เวลาเดินทาง</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function updateMini(slotData) {
      var sl = slotData;
      var cutoff = boarding ? boarding.pickupTime : (route && arrivalEl.value !== '—' ? arrivalEl.value : baseTime);
      var closedNow = isSlotPast(date, cutoff);
      if(availabilityEl) {
        availabilityEl.textContent = 'ว่าง ' + sl.available + ' / ' + sl.capacity;
        availabilityEl.classList.toggle('danger', sl.available === 0);
      }
      $('mini').innerHTML = '<b>คงเหลือ:</b> ที่นั่งว่าง <b class="' + (sl.available===0?'danger':'') + '">' + sl.available + '</b> / ' + sl.capacity + (closedNow ? ' • <span class="closed-label"><b>ปิดทำรายการแล้ว</b></span>' : '') + '<br/><span style="color:var(--muted)">Tip: หากต้องการเปลี่ยนจำนวนหรือเปลี่ยนจุด ให้ยกเลิกจนเหลือ 0 แล้วจองใหม่</span>';
    }

    function updateBookBtn(slotData) {
      if(pending) {
        bookBtn.disabled = true;
        return;
      }
      if(legacy) {
        bookBtn.disabled = true;
        noteEl.textContent = 'รอบเดิมเปิดให้ดูหรือยกเลิกเท่านั้น';
        return;
      }
      var isFull = (slotData && typeof slotData.available === 'number' && slotData.available <= 0);
      var room = String(roomEl.value||'').trim();

      // ถ้ารอบนี้เต็ม: ยังเข้าไปดู/ยกเลิกได้ แต่ไม่ให้จองเพิ่ม
      if(!room) {
        if(isFull) {
          bookBtn.disabled = true;
          noteEl.textContent = 'รอบนี้ที่นั่งเต็ม (ดูรายการ/ยกเลิกได้)';
        } else {
          bookBtn.disabled = false;
          noteEl.textContent = '';
        }
        return;
      }

      var roomK = safeKey(room);
      var ex = slotData.bookings && slotData.bookings[roomK];
      var booked = ex ? (ex.pax||0) : 0;

      if(booked > 0) {
        bookBtn.disabled = true;
        var placeText = (ex.pickup && ex.destination) ? (ex.pickup + ' → ' + ex.destination) : '';
        noteEl.innerHTML = 'ห้อง <b>' + escapeHtml(room) + '</b> จองแล้ว <b>' + booked + '</b> คนในรอบนี้' + (placeText ? (' (' + escapeHtml(placeText) + ')') : '') + ' — กันการกดซ้ำ';
        return;
      }

      if(isFull) {
        bookBtn.disabled = true;
        noteEl.textContent = 'รอบนี้ที่นั่งเต็ม (ดูรายการ/ยกเลิกได้)';
      } else {
        bookBtn.disabled = false;
        noteEl.textContent = '';
      }
    }

    function showSlot(next) {
      slot = next;
      updateMini(slot);
      updateBookBtn(slot);
      renderBookings(slot);
    }

    async function refresh() {
      var before = revision;
      try {
        var next = await storage.getSlot(date, dir.key, baseTime);
        if(version === viewVersion && before === revision) showSlot(next);
      } catch(err) {
        console.error(err);
        if(version === viewVersion) setStatusLine('error');
      }
    }

    if(!selected) placeEl.addEventListener('change', function(){
      updateArrival();
      updateMini(slot);
    });
    roomEl.addEventListener('input', function(){ updateBookBtn(slot); });

    window.__back = function(){ setHash(legacy ? '/legacy' : '/'); };

    window.__book = async function(){
      if(pending || version !== viewVersion) return;
      var placeKey = selected ? selected.key : String(placeEl.value||'').trim();
      var room = String(roomEl.value||'').trim();
      var pax = parseInt(paxEl.value,10);
      if(!placeKey) { toast('ข้อมูลไม่ครบ','กรุณาเลือก ' + dir.selectLabel); return; }
      if(!room) { toast('ข้อมูลไม่ครบ','กรุณาใส่เลขห้อง'); return; }
      if(!Number.isFinite(pax) || pax<=0) { toast('ข้อมูลไม่ครบ','กรุณาใส่จำนวนคน'); return; }
      var t = calcTimes(dir.key, baseTime, placeKey);
      if(!t) { toast('ข้อมูลไม่ถูกต้อง','ไม่สามารถคำนวณเวลาได้'); return; }

      pending = true;
      updateBookBtn(slot);
      try {
        var res = await storage.book(date, dir.key, baseTime, room, pax, placeKey, t);
        if(!res.ok) toast('จองไม่สำเร็จ', res.msg || '');
        else toast('จองสำเร็จ', dir.label + ' • ห้อง ' + room + ' • ' + pax + ' คน • ขึ้นรถ ' + t.pickupTime);
        if(version === viewVersion) await refresh();
      } finally {
        pending = false;
        if(version === viewVersion) updateBookBtn(slot);
      }
    };

    window.__cancel = async function(){
      if(pending || version !== viewVersion) return;
      var room = String(roomEl.value||'').trim();
      var pax = parseInt(paxEl.value,10);
      if(!room) { toast('ข้อมูลไม่ครบ','กรุณาใส่เลขห้อง'); return; }
      if(!Number.isFinite(pax) || pax<=0) { toast('ข้อมูลไม่ครบ','กรุณาใส่จำนวนคน'); return; }
      pending = true;
      updateBookBtn(slot);
      try {
        var res = await storage.cancel(date, dir.key, baseTime, room, pax);
        if(!res.ok) toast('ยกเลิกไม่สำเร็จ', res.msg || '');
        else toast('ยกเลิกสำเร็จ', 'คืนที่นั่ง ' + pax + ' คน • ห้อง ' + room);
        if(version === viewVersion) await refresh();
      } finally {
        pending = false;
        if(version === viewVersion) updateBookBtn(slot);
      }
    };

    if(!selected) updateArrival();
    showSlot(slot);
    stopWatching = storage.watchSlots(date, dir.key, [baseTime], function(time, next){
      if(version !== viewVersion) return;
      revision++;
      showSlot(next);
    }, function(state){
      if(version === viewVersion) setStatusLine(state);
    });
  }

  async function viewLogs(version) {
    renderNav('/logs');
    setStatusLine();
    var date = (loadUi().date || todayKey());
    var monthKey = monthKeyFromDateStr(date);
    var stats = await storage.getStatsMonth(monthKey);

    function val(dirKey, t) {
      var k = timeKey(t);
      return (stats[dirKey] && typeof stats[dirKey][k] === 'number') ? stats[dirKey][k] : 0;
    }

    var outTimes = DIRS.out.baseTimes.concat(LEGACY_DIRS.out.baseTimes.filter(function(t){ return val('out', t) > 0; }));
    var backTimes = DIRS.back.baseTimes.concat(LEGACY_DIRS.back.baseTimes.filter(function(t){ return val('back', t) > 0; }));
    var outTop = { time:null, value:0 };
    outTimes.forEach(function(t){ var v = val('out',t); if(v>outTop.value) outTop={time:roundLabel(t),value:v}; });
    var backTop = { time:null, value:0 };
    backTimes.forEach(function(t){ var v = val('back',t); if(v>backTop.value) backTop={time:roundLabel(t),value:v}; });

    var recent = await storage.queryLogs({ mode:'all', limit: 250 });
    if(version !== viewVersion) return;

    function buildBars(map, times) {
      map = map || {};
      var maxVal = 0;
      times.forEach(function(t){ var v = map[timeKey(t)] || 0; if(v>maxVal) maxVal=v; });
      return times.map(function(t){
        var v = map[timeKey(t)] || 0;
        var w = maxVal ? Math.round((v/maxVal)*100) : 0;
        return '<div class="bar">' +
          '<div class="lbl">'+escapeHtml(roundLabel(t))+'</div>' +
          '<div class="track"><div class="fill" style="width:'+w+'%"></div></div>' +
          '<div class="num">'+v+'</div>' +
        '</div>';
      }).join('');
    }

    var rows = recent.map(function(e){
      var ts = e.tsMs ? new Date(e.tsMs).toLocaleString() : '';
      var action = (e.action === 'BOOK')
        ? '<span style="color:var(--ok);font-weight:900">BOOK</span>'
        : '<span style="color:var(--danger);font-weight:900">CANCEL</span>';
      var dir = e.dir === 'out' ? 'ขาไป' : (e.dir === 'back' ? 'ขากลับ' : (e.dir||''));
      var route = (e.pickup && e.destination) ? (e.pickup + ' → ' + e.destination) : '';
      return '<tr>'+
        '<td>'+escapeHtml(ts)+'</td>'+
        '<td>'+action+'</td>'+
        '<td>'+escapeHtml(dir)+'</td>'+
        '<td>'+escapeHtml(e.roundKey && roundRoute(e.roundKey) ? roundLabel(e.roundKey) : (e.time||''))+'</td>'+
        '<td>'+escapeHtml(route)+'</td>'+
        '<td>'+escapeHtml(e.arriveTime || (e.pickupTime ? 'ขึ้นรถ ' + e.pickupTime : ''))+'</td>'+
        '<td>'+escapeHtml(e.room||'')+'</td>'+
        '<td><b>'+escapeHtml((typeof e.pax==='number')?e.pax:(e.pax||''))+'</b></td>'+
      '</tr>';
    }).join('\n');

    $('view').innerHTML =
      '<section class="card">' +
        '<div class="card-h">' +
          '<div><h2>บันทึก/สถิติ</h2><p class="hint">เดือน <b>'+escapeHtml(monthKey)+'</b> • Export แบบ EXCOM ได้ โดยแยก A/B/C = Phase 1 และ D = Phase 2</p></div>' +
          '<div class="row"><button class="btn ghost" onclick="window.__goSchedule()">กลับหน้าตาราง</button></div>' +
        '</div>' +
        '<div class="card-b">' +
          '<div class="card inset" style="margin-bottom:12px">' +
            '<div class="card-b">' +
              '<div class="row" style="align-items:flex-end; justify-content:space-between">' +
                '<div class="row" style="flex:1;">' +
                  '<div class="field" style="max-width:230px"><label for="expDay">Export ตามวัน</label><input id="expDay" type="date" /></div>' +
                  '<button class="btn" onclick="window.__exportDayFromInput()">Export วัน</button>' +
                  '<div class="field" style="max-width:230px"><label for="expMonth">Export ตามเดือน</label><input id="expMonth" type="month" /></div>' +
                  '<button class="btn" onclick="window.__exportMonthFromInput()">Export เดือน</button>' +
                '</div>' +
                '<div class="row"><button class="btn" onclick="window.__exportAll()">Excel ทั้งหมด</button></div>' +
              '</div>' +
              '<div class="mini">หมายเหตุ: ไฟล์ export จะมี EXCOM Summary, Phase Summary, Building Summary, Daily Summary, Round Summary และ Detail Log โดยคิด % จาก Net Guests Using Service ในช่วงที่เลือก</div>' +
            '</div>' +
          '</div>' +

          '<div class="grid">' +
            '<div class="card inset">' +
              '<div class="card-h"><div><h2 style="font-size:15.5px">สถิติ • ขาไป</h2><p class="hint">เวลาที่จองเยอะสุด: <b>'+(outTop.time||'—')+'</b> ('+outTop.value+' คน)</p></div></div>' +
              '<div class="card-b">'+ buildBars(stats.out, outTimes) +'</div>' +
            '</div>' +
            '<div class="card inset">' +
              '<div class="card-h"><div><h2 style="font-size:15.5px">สถิติ • ขากลับ</h2><p class="hint">เวลาที่จองเยอะสุด: <b>'+(backTop.time||'—')+'</b> ('+backTop.value+' คน)</p></div></div>' +
              '<div class="card-b">'+ buildBars(stats.back, backTimes) +'</div>' +
            '</div>' +
          '</div>' +

          '<div class="divider"></div>' +

          '<div class="table-scroll"><table>' +
            '<thead><tr><th>เวลา</th><th>Action</th><th>ขา</th><th>รอบ</th><th>เส้นทาง</th><th>เวลาเดินทาง</th><th>ห้อง</th><th>คน</th></tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="8" class="mini">ยังไม่มี Log</td></tr>') + '</tbody>' +
          '</table></div>' +
        '</div>' +
      '</section>';

    var dayEl = $('expDay');
    var monthEl = $('expMonth');
    if(dayEl) dayEl.value = (loadUi().date || todayKey());
    if(monthEl) monthEl.value = monthKeyFromDateStr(loadUi().date || todayKey());

    window.__exportDayFromInput = function(){
      var v = (dayEl && dayEl.value) ? dayEl.value : (loadUi().date || todayKey());
      doExport('day', v).catch(console.error);
    };
    window.__exportMonthFromInput = function(){
      var v = (monthEl && monthEl.value) ? monthEl.value : monthKeyFromDateStr(loadUi().date || todayKey());
      doExport('month', v).catch(console.error);
    };
    window.__exportAll = function(){ doExport('all','').catch(console.error); };

    window.__goSchedule = function(){ setHash('/'); };
  }

  // ============================
  // Router
  // ============================
  async function render() {
    var version = ++viewVersion;
    stopWatching();
    stopWatching = function(){};
    $('view').innerHTML = '<div class="mini">กำลังโหลดข้อมูล</div>';
    try {
      await renderPage(version);
    } catch(err) {
      console.error(err);
      if(version !== viewVersion) return;
      setStatusLine('error');
      $('view').innerHTML = '<div class="mini">โหลดข้อมูลไม่สำเร็จ <button id="retryView" class="btn ghost">ลองอีกครั้ง</button></div>';
      $('retryView').addEventListener('click', render);
    }
  }

  function renderPage(version) {
    var h = parseHash();
    if(h.path === '/logs') return viewLogs(version);
    if(h.path === '/book') {
      var d = h.params.get('date') || (loadUi().date || todayKey());
      if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
        var ui2 = loadUi();
        ui2.date = d;
        saveUi(ui2);
      } else {
        d = loadUi().date || todayKey();
      }
      var dir = h.params.get('dir') || 'out';
      var t = h.params.get('time') || '';
      return viewBooking(d, dir==='back'?'back':'out', t, h.params.get('stop'), version);
    }
    return viewSchedule(version);
  }

  // ============================
  // Init
  // ============================
  async function boot() {
    if(!location.hash) location.hash = '#/';
    await storage.initFirebase(); // try firebase first
    window.addEventListener('hashchange', function(){ render().catch(console.error); });
    render().catch(console.error);
  }

  boot().catch(console.error);

})();
</script>
</body>
</html>
